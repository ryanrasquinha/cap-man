<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PAC-MAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#12125a 0%,#05051c 65%,#000 100%);color:#8c8cff;font-family:'Press Start 2P',monospace;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
canvas{height:min(calc(100dvh - 48px),calc(100vw * 700 / 560));aspect-ratio:560/700;background:#000;border-radius:16px;box-shadow:0 0 0 2px #2121ff,0 0 50px #2121ff77,0 0 120px #2121ff33;touch-action:none;image-rendering:auto}
.help{font-size:8px;line-height:1.6;text-align:center;padding:0 10px}
@media(max-width:600px){.help{display:none}}
</style>
</head>
<body>
<canvas id="c" width="560" height="700"></canvas>
<div class="help">ARROWS KEYS / WASD TO MOVE &nbsp; P PAUSE &nbsp; M MUTE &nbsp; SWIPE ON TOUCH</div>
<script>
(()=>{
const T=20,OY=40,W=28,H=31;
const MAP=[
"############################",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#o####.#####.##.#####.####o#",
"#.####.#####.##.#####.####.#",
"#..........................#",
"#.####.##.########.##.####.#",
"#.####.##.########.##.####.#",
"#......##....##....##......#",
"######.##### ## #####.######",
"     #.##### ## #####.#     ",
"     #.##          ##.#     ",
"     #.## ###--### ##.#     ",
"######.## #      # ##.######",
"      .   #      #   .      ",
"######.## #      # ##.######",
"     #.## ######## ##.#     ",
"     #.##          ##.#     ",
"     #.## ######## ##.#     ",
"######.## ######## ##.######",
"#............##............#",
"#.####.#####.##.#####.####.#",
"#.####.#####.##.#####.####.#",
"#o..##.......  .......##..o#",
"###.##.##.########.##.##.###",
"###.##.##.########.##.##.###",
"#......##....##....##......#",
"#.##########.##.##########.#",
"#.##########.##.##########.#",
"#..........................#",
"############################"];
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const DIRS=[{x:0,y:-1},{x:-1,y:0},{x:0,y:1},{x:1,y:0}]; // up left down right
const GH=[{col:'#ff2a2a',corner:[25,-3]},{col:'#ffb8ff',corner:[2,-3]},{col:'#25f0ff',corner:[27,31]},{col:'#ffb852',corner:[0,31]}];
const REL=[0,90,300,520], SCH=[420,1200,420,1200,300,1200,300,Infinity];
let dots,left,score=0,hi=0,lives=3,level=1,state='title',stateT=0,pac,ghosts=[],modeT=0,lastMi=0,frame=0,frightT=0,combo=0,playT=0,paused=false,muted=false,bonus=false,pops=[],waka=0;
try{hi=+localStorage.getItem('pacman-hi')||0}catch(e){}

const ch=(c,r)=>r<0||r>=H?'#':MAP[r][((c%W)+W)%W];
const wall=(c,r,door)=>{const k=ch(c,r);return k==='#'||(k==='-'&&!door)};
const cen=e=>((e.x%T)+T)%T===T/2&&((e.y%T)+T)%T===T/2;
const tc=e=>Math.floor(e.x/T), tr=e=>Math.floor(e.y/T);
const modeIdx=()=>{let t=modeT,i=0;while(t>=SCH[i]){t-=SCH[i];i++}return i};

/* ---------- audio ---------- */
let AC;
function snd(f,d=.08,type='square',v=.04,f2){
  if(muted)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;
    o.type=type;o.frequency.setValueAtTime(f,n);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);
    g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d);}catch(e){}
}

/* ---------- maze rendering (pre-rendered, neon outline) ---------- */
function buildMaze(col){
  const c=document.createElement('canvas');c.width=W*T;c.height=H*T;
  const x=c.getContext('2d');
  x.fillStyle='#070730';
  for(let r=0;r<H;r++)for(let q=0;q<W;q++)if(MAP[r][q]==='#')x.fillRect(q*T,r*T,T,T);
  x.strokeStyle=col;x.lineWidth=2.5;x.lineCap='round';x.shadowColor=col;x.shadowBlur=9;
  x.beginPath();
  for(let r=0;r<H;r++)for(let q=0;q<W;q++){
    if(MAP[r][q]!=='#')continue;
    const e=(dc,dr)=>{const rr=r+dr,cc=q+dc;return rr>=0&&rr<H&&cc>=0&&cc<W&&MAP[rr][cc]!=='#'};
    const X=q*T,Y=r*T;
    if(e(0,-1)){x.moveTo(X,Y);x.lineTo(X+T,Y)}
    if(e(0,1)){x.moveTo(X,Y+T);x.lineTo(X+T,Y+T)}
    if(e(-1,0)){x.moveTo(X,Y);x.lineTo(X,Y+T)}
    if(e(1,0)){x.moveTo(X+T,Y);x.lineTo(X+T,Y+T)}
  }
  x.stroke();
  x.shadowColor='#ffb8ff';x.strokeStyle='#ffb8ff';x.beginPath();x.moveTo(13*T,12*T+T/2);x.lineTo(15*T,12*T+T/2);x.stroke();
  return c;
}
const mazeBlue=buildMaze('#2f3cff'), mazeWhite=buildMaze('#ffffff');

/* ---------- game setup ---------- */
function resetDots(){dots=MAP.map(r=>[...r].map(k=>k==='.'?1:k==='o'?2:0));left=dots.flat().filter(Boolean).length}
function resetPos(){
  pac={x:13*T+10,y:23*T+10,dir:1,nd:1,anim:0};
  const S=[[14,11,'norm',1],[14,14,'house',-1],[12,14,'house',-1],[16,14,'house',-1]];
  ghosts=S.map((s,i)=>({id:i,col:GH[i].col,corner:GH[i].corner,x:s[0]*T+10,y:s[1]*T+10,st:s[2],dir:s[3],fr:false,rel:REL[i]}));
  modeT=0;lastMi=0;frightT=0;playT=0;combo=0;pops=[];
}
function newGame(){score=0;lives=3;level=1;bonus=false;resetDots();resetPos();state='ready';stateT=0}
const addScore=n=>{score+=n;if(score>=10000&&!bonus){bonus=true;lives++;snd(500,.4,'square',.05,1500)}};
const saveHi=()=>{hi=Math.max(hi,score);try{localStorage.setItem('pacman-hi',hi)}catch(e){}};

/* ---------- movement ---------- */
function mv(e){
  const d=DIRS[e.dir];e.x+=d.x;e.y+=d.y;
  if(e.x<=-T*1.5)e.x+=(W+2)*T;else if(e.x>=W*T+T*1.5)e.x-=(W+2)*T;
}
function stepPac(){
  const p=pac;
  if(cen(p)){
    const c=tc(p),r=tr(p),v=(dots[r]||[])[c];
    if(v){
      dots[r][c]=0;left--;
      if(v===1){addScore(10);waka^=1;snd(waka?260:390,.06)}
      else{addScore(50);frightT=Math.max(120,420-level*50);combo=0;
        ghosts.forEach(g=>{if(g.st!=='eaten'){if(!g.fr&&g.st==='norm'&&g.dir>=0)g.dir=(g.dir+2)%4;g.fr=true}});
        snd(180,.35,'sawtooth',.05,700)}
    }
    const n=DIRS[p.nd];
    if(!wall(c+n.x,r+n.y,false))p.dir=p.nd;
    const d=DIRS[p.dir];
    if(wall(c+d.x,r+d.y,false))return;
  }
  mv(p);p.anim+=.16;
}
function target(g){
  if(g.st==='eaten')return[14,14];
  if(g.st==='leaving')return[14,11];
  if(modeIdx()%2===0)return g.corner;
  const pc=tc(pac),pr=tr(pac),d=DIRS[pac.dir];
  if(g.id===0)return[pc,pr];
  if(g.id===1)return[pc+4*d.x,pr+4*d.y];
  if(g.id===2){const b=ghosts[0];return[2*(pc+2*d.x)-tc(b),2*(pr+2*d.y)-tr(b)]}
  return Math.hypot(tc(g)-pc,tr(g)-pr)>8?[pc,pr]:g.corner;
}
function stepGhost(g){
  if(cen(g)){
    const c=tc(g),r=tr(g);
    if(g.st==='eaten'&&c===14&&r===14){g.st='leaving';g.dir=-1}
    if(g.st==='leaving'&&r===11&&(c===13||c===14))g.st='norm';
    const door=g.st==='eaten'||g.st==='leaving';
    let o=[];
    for(let d=0;d<4;d++){
      if(g.dir>=0&&d===(g.dir+2)%4)continue;
      if(!wall(c+DIRS[d].x,r+DIRS[d].y,door))o.push(d);
    }
    if(!o.length)o=[(g.dir+2)%4];
    if(g.fr&&g.st==='norm')g.dir=o[Math.floor(Math.random()*o.length)];
    else{
      const [tx,ty]=target(g);let best=1e9;
      for(const d of o){const dd=(c+DIRS[d].x-tx)**2+(r+DIRS[d].y-ty)**2;if(dd<best){best=dd;g.dir=d}}
    }
  }
  mv(g);
}

/* ---------- update ---------- */
function die(){state='dying';stateT=0;snd(700,1,'sawtooth',.05,50)}
function update(){
  frame++;
  if(state==='title'||state==='over'||paused)return;
  stateT++;
  if(state==='ready'){if(stateT>=150)state='play';return}
  if(state==='dying'){
    if(stateT>=120){lives--;if(lives<=0){saveHi();state='over'}else{resetPos();state='ready';stateT=0}}
    return}
  if(state==='win'){if(stateT>=140){level++;resetDots();resetPos();state='ready';stateT=0}return}
  playT++;modeT++;
  const mi=modeIdx();
  if(mi!==lastMi){lastMi=mi;ghosts.forEach(g=>{if(g.st==='norm'&&g.dir>=0)g.dir=(g.dir+2)%4})}
  if(frightT>0&&--frightT===0)ghosts.forEach(g=>g.fr=false);
  stepPac();stepPac();
  for(const g of ghosts){
    if(g.st==='house'){if(playT>=g.rel){g.st='leaving';g.dir=-1}continue}
    const c=tc(g),r=tr(g);
    let sp=g.st==='eaten'?4:g.fr?1:(frame%(7+Math.min(level,8))?2:0);
    if(g.st==='norm'&&r===14&&(c<6||c>21))sp=1;
    for(let i=0;i<sp;i++)stepGhost(g);
  }
  pops=pops.filter(p=>--p.t>0);
  for(const g of ghosts){
    if(g.st==='eaten'||g.st==='house')continue;
    if((g.x-pac.x)**2+(g.y-pac.y)**2<130){
      if(g.fr){g.fr=false;g.st='eaten';const p=200<<Math.min(combo++,3);addScore(p);pops.push({x:g.x,y:g.y,t:55,s:p});snd(300,.3,'square',.05,1400)}
      else{die();return}
    }
  }
  if(left<=0){state='win';stateT=0}
}

/* ---------- drawing ---------- */
function txt(s,x,y,size,col,align='center',glow){
  ctx.font=size+"px 'Press Start 2P',monospace";ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.shadowColor=glow||'transparent';ctx.shadowBlur=glow?14:0;ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.shadowBlur=0;
}
function drawPac(x,y,m,dir,r=9){
  const base=[-Math.PI/2,Math.PI,Math.PI/2,0][dir];
  ctx.fillStyle='#ffe600';ctx.shadowColor='#ffe600';ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,r,base+m,base+Math.PI*2-m);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
}
function drawGhost(g){
  let x=g.x,y=g.y+OY;
  if(g.st==='house')y+=Math.sin(frame/8+g.id)*3;
  const f=Math.floor(frame/8)%2;
  const flash=g.fr&&frightT<120&&Math.floor(frightT/12)%2;
  if(g.st!=='eaten'){
    const col=g.fr?(flash?'#fff':'#2a2aff'):g.col;
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(x,y-1,9,Math.PI,0);
    for(let i=0;i<=6;i++)ctx.lineTo(x+9-i*3,y+((i+f)%2?5:9));
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  }
  if(g.fr&&g.st!=='eaten'){
    ctx.fillStyle=flash?'#f33':'#ffd0b0';
    ctx.fillRect(x-4,y-4,2.5,2.5);ctx.fillRect(x+2,y-4,2.5,2.5);
    ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1.3;ctx.beginPath();
    for(let i=0;i<=6;i++)ctx.lineTo(x-6+i*2,y+4+(i%2?-1.5:1));ctx.stroke();
  }else{
    const d=DIRS[Math.max(0,g.dir)];
    ctx.fillStyle='#fff';
    for(const s of[-3.6,3.6]){ctx.beginPath();ctx.ellipse(x+s,y-2,3,3.8,0,0,7);ctx.fill()}
    ctx.fillStyle='#1a1aff';
    for(const s of[-3.6,3.6]){ctx.beginPath();ctx.arc(x+s+d.x*1.6,y-2+d.y*2,1.7,0,7);ctx.fill()}
  }
}
function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,560,700);
  const flashWin=state==='win'&&Math.floor(stateT/14)%2;
  ctx.drawImage(flashWin?mazeWhite:mazeBlue,0,OY);
  // dots
  ctx.fillStyle='#ffd7c2';
  if(dots&&state!=='win')for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const v=dots[r][c];if(!v)continue;
    ctx.beginPath();
    if(v===1)ctx.arc(c*T+10,r*T+10+OY,2.2,0,7);
    else if(Math.floor(frame/16)%2===0||state!=='play'){ctx.shadowColor='#ffd7c2';ctx.shadowBlur=10;ctx.arc(c*T+10,r*T+10+OY,6,0,7)}
    ctx.fill();ctx.shadowBlur=0;
  }
  const hideAll=state==='title';
  if(pac&&!hideAll){
    if(state==='dying'){
      const t=Math.min(1,Math.max(0,(stateT-20)/80));
      if(t<1)drawPac(pac.x,pac.y+OY,Math.PI*0.25+t*Math.PI*0.75,0);
      else if(stateT<110){ctx.strokeStyle='#ffe600';ctx.lineWidth=2;for(let i=0;i<8;i++){const a=i*Math.PI/4,k=(stateT-100)*1.2+4;ctx.beginPath();ctx.moveTo(pac.x+Math.cos(a)*k,pac.y+OY+Math.sin(a)*k);ctx.lineTo(pac.x+Math.cos(a)*(k+4),pac.y+OY+Math.sin(a)*(k+4));ctx.stroke()}}
    }else drawPac(pac.x,pac.y+OY,state==='ready'?0.6:0.04+Math.abs(Math.sin(pac.anim))*0.24*Math.PI,pac.dir);
  }
  if(!hideAll&&state!=='dying'&&state!=='win')ghosts.forEach(drawGhost);
  for(const p of pops)txt(p.s,p.x,p.y+OY,10,'#25f0ff','center','#25f0ff');
  // HUD
  const h=Math.max(hi,score);
  txt('1UP',20,12,10,'#fff','left');txt(String(score).padStart(6,'0'),20,28,12,'#ffe600','left');
  txt('HIGH SCORE',280,12,10,'#fff');txt(String(h).padStart(6,'0'),280,28,12,'#ffe600');
  txt('LVL '+level,540,20,10,'#ff8c8c','right');
  for(let i=0;i<lives-1;i++)drawPac(26+i*28,680,0.5,3,10);
  // overlays
  if(state==='ready')txt('READY!',280,OY+17*T+10,14,'#ffe600','center','#ffe600');
  if(state==='over'){txt('GAME OVER',280,OY+17*T+10,14,'#ff2a2a','center','#ff2a2a');
    if(Math.floor(frame/30)%2)txt('PRESS ENTER OR TAP',280,OY+20*T,9,'#fff')}
  if(paused)txt('PAUSED',280,OY+17*T+10,14,'#fff','center','#8c8cff');
  if(state==='title'){
    ctx.fillStyle='rgba(0,0,10,.82)';ctx.fillRect(0,0,560,700);
    txt('PAC-MAN',280,230,52,'#ffe600','center','#ffb800');
    const t=frame/14;
    drawPac(200,310,0.04+Math.abs(Math.sin(t))*0.24*Math.PI,3,16);
    ghosts.forEach((g,i)=>{drawGhost({...g,id:i,x:262+i*46,y:310-OY,st:'norm',fr:false,dir:1})});
    for(let i=0;i<5;i++){ctx.fillStyle='#ffd7c2';ctx.beginPath();ctx.arc(230+i*0,0,0,0,0)}
    txt('EAT ALL THE DOTS. AVOID THE GHOSTS.',280,400,9,'#c8c8ff');
    txt('POWER PELLETS TURN THE TABLES.',280,424,9,'#c8c8ff');
    if(Math.floor(frame/30)%2)txt('PRESS ENTER OR TAP TO START',280,510,11,'#fff','center','#2f3cff');
    txt('HIGH SCORE '+String(hi).padStart(6,'0'),280,590,10,'#ff8c8c');
  }
}

/* ---------- input ---------- */
function setDir(d){
  if(!pac)return;
  pac.nd=d;
  if(state==='play'&&d===(pac.dir+2)%4)pac.dir=d;
}
function start(){if(state==='title'||state==='over'){AC&&AC.resume&&AC.resume();newGame()}}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),m={arrowup:0,w:0,arrowleft:1,a:1,arrowdown:2,s:2,arrowright:3,d:3};
  if(k in m){setDir(m[k]);e.preventDefault()}
  else if(k==='enter'||k===' '){start();if(k===' ')e.preventDefault()}
  else if(k==='p'&&(state==='play'||state==='ready'))paused=!paused;
  else if(k==='m')muted=!muted;
});
let tx=0,ty=0,tdown=false,moved=false;
cv.addEventListener('pointerdown',e=>{tdown=true;moved=false;tx=e.clientX;ty=e.clientY;AC&&AC.resume&&AC.resume()});
cv.addEventListener('pointermove',e=>{
  if(!tdown)return;
  const dx=e.clientX-tx,dy=e.clientY-ty;
  if(Math.hypot(dx,dy)>18){moved=true;setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?3:1):(dy>0?2:0));tx=e.clientX;ty=e.clientY}
});
addEventListener('pointerup',()=>{if(tdown&&!moved)start();tdown=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')paused=true});

/* ---------- main loop (fixed 60 Hz timestep) ---------- */
resetDots();resetPos();
let last=performance.now(),acc=0;
(function loop(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=1000/60){update();acc-=1000/60}
  render();requestAnimationFrame(loop);
})(last);
})();
</script>
</body>
</html>
